<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Добавки: трекер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--bg:#18263b;--card:#243a55;--card2:#2c4766;--mut:#9db2c9;--ok:#2ed3a0;--pill:#04a384;--org:#ff9b4a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font:600 16px/1.4 Nunito,"SF Pro Rounded",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
button{font:inherit;color:inherit}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--card);border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer;color:var(--mut)}
.tab[aria-pressed="true"]{background:#fff;color:var(--bg)}
.badge{display:flex;width:max-content;max-width:100%;margin:22px auto 0;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:11px 20px 11px 14px;font-weight:900;font-size:18px}
.badge svg{width:24px;height:24px}
h1{margin:18px 0 6px;text-align:center;font-size:32px;font-weight:900;letter-spacing:-.01em}
.clk{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--mut);font-weight:800;font-size:18px}
.chain{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0 8px}
.sm{width:66px;height:66px;border-radius:50%;background:var(--card);border:4px solid #1d6b63;display:grid;place-items:center;font-size:28px;flex:none}
.sm.nx{border-color:#34506e;filter:grayscale(.8);opacity:.7}
.sm.e{visibility:hidden}
.ar{color:var(--ok);font-size:22px;font-weight:900;opacity:.7}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:14px;border-radius:50%;background:#1f4560;display:grid;place-items:center;font-size:66px}
.lv{display:block;width:max-content;margin:18px auto 0;background:#33506f;border-radius:8px;padding:3px 12px;font-weight:900;font-size:15px;position:relative;z-index:1;margin-bottom:-14px}
.bub{background:var(--card);border-radius:22px;padding:30px 20px 18px;text-align:center;position:relative;margin-top:18px}
.bub:before{content:"";position:absolute;top:-8px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:10px solid var(--card)}
.bub p{margin:0;font-size:18px;line-height:1.45}
.bub .nx{margin-top:10px;color:var(--mut);font-size:14px;font-weight:800}
.st{display:flex;gap:10px;margin-top:14px}
.st div{flex:1;background:var(--card);border-radius:18px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:26px;font-weight:900}
.st span{color:var(--mut);font-size:13px;font-weight:800}
.card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:19px;font-weight:900}
.row{display:flex;align-items:center;gap:10px}
input{width:120px;background:var(--bg);border:2px solid #34506e;color:#fff;border-radius:14px;padding:10px;font:900 26px Nunito,sans-serif;text-align:center}
.row b{font-size:20px}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chip{border:0;background:var(--card2);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer}
.go{width:100%;margin-top:12px;border:0;border-radius:18px;padding:17px;background:var(--ok);color:#0c2a2a;font:900 20px Nunito,sans-serif;cursor:pointer}
.go:active{transform:scale(.98)}
.wk{display:flex;justify-content:space-between}
.dt{text-align:center;font-size:12px;color:var(--mut);font-weight:800}
.dt i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--card2);margin:0 auto 5px;font-style:normal;font-size:16px}
.dt.on i{background:var(--ok);color:#0c2a2a}
.h{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #34506e}
.h:first-of-type{border-top:0}
.x{border:0;background:none;color:var(--mut);font-size:24px;cursor:pointer;padding:0 6px}
.note{color:var(--mut);font-size:12px;margin-top:20px;text-align:center}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .6s}}
main{padding-bottom:130px}
.mine{flex:none;border:2px dashed #4a6a8c;background:none;border-radius:999px;padding:7px 14px;font-weight:800;color:var(--ok);cursor:pointer}
.mas{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:8;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.mas button{pointer-events:auto;width:78px;height:78px;border:0;background:none;padding:0;cursor:pointer;flex:none}
.mas svg{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite}
.ey{transform-origin:50px 56px;animation:bl 4s infinite}
.mb{max-width:210px;background:#fff;color:#12283a;border-radius:18px 18px 4px 18px;padding:10px 13px;font-weight:800;font-size:14px;line-height:1.3;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .2s,transform .2s;margin-bottom:34px;pointer-events:none}
.mb.o{opacity:1;transform:none}
.sh{position:fixed;inset:0;z-index:10;display:none}
.sh.o{display:block}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:85vh;max-height:85dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .22s ease-out}
.pn h3{margin:0 0 6px;text-align:center;font-size:21px;font-weight:900}
.cl{position:absolute;right:12px;top:10px;border:0;background:none;font-size:28px;color:var(--mut);cursor:pointer}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px;text-align:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);margin-bottom:8px;cursor:pointer;border:0;text-align:left;font-size:17px}
.opt.on{box-shadow:inset 0 0 0 2px var(--ok)}
.opt .ck{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:transparent}
.opt.on .ck{background:var(--ok);color:#0c2a2a}
.add{display:flex;gap:6px;margin:14px 0 4px}
.add input{width:auto;flex:1;min-width:0;font:700 16px Nunito,sans-serif;padding:10px;border-radius:12px;text-align:left}
.add #cu{flex:none;width:56px;text-align:center}
.add #cd{flex:none;width:72px;text-align:center}
.add button{flex:none;width:46px;border:0;border-radius:12px;background:var(--ok);color:#0c2a2a;font-size:26px;font-weight:900;cursor:pointer}
#er{color:var(--org);min-height:20px;margin:6px 0}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.mas svg,.ey,.pn{animation:none}}
.tx{width:100%;font:800 18px Nunito,sans-serif;text-align:left;padding:12px 14px;margin-bottom:6px}
.emr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.eb,.ub{border:0;background:var(--card2);border-radius:12px;min-width:44px;height:44px;font-size:22px;cursor:pointer;color:#fff}
.ub{font-size:15px;font-weight:800;padding:0 14px}
.eb.on,.ub.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--ok)}
.stp{display:flex;gap:12px;justify-content:center;align-items:center}
.stp button{width:52px;height:52px;border-radius:50%;border:0;background:var(--card2);color:#fff;font-size:28px;font-weight:900;cursor:pointer}
.stp input{width:130px}
.addbtn{width:100%;border:2px dashed #4a6a8c;background:none;border-radius:16px;padding:14px;font-weight:900;font-size:17px;color:var(--ok);cursor:pointer;margin-top:4px}
.star{color:#ffd54a;font-weight:800;font-size:12px;margin-left:6px}
.f{display:flex;gap:8px;margin:8px 0}
.f label{flex:1;font-size:12px;color:var(--mut);font-weight:800}
.f input{width:100%;font:900 20px Nunito,sans-serif;padding:10px;margin-top:4px}
.bar{height:14px;border-radius:7px;background:#2a4660;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:7px;transition:width .6s}
.g2{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.wr{display:flex;gap:8px;margin-top:10px}
.wr input{flex:1;width:auto;font-size:20px}
.wr button{border:0;border-radius:12px;background:var(--card2);color:#fff;padding:0 16px;font-weight:900;cursor:pointer}
.rec{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;color:#dfe9f3}
.warn{background:#4a3320;color:#ffcf9d;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.tab .ic{width:18px;height:18px;margin-right:6px;vertical-align:-4px}
.ring .c .ic{width:72px;height:72px;color:var(--ok);stroke-width:1.5}
.sm .ic{width:30px;height:30px;color:var(--ok)}
.sm.nx .ic{color:var(--mut)}
.mine .ic{width:17px;height:17px;margin-right:4px;vertical-align:-3px}
.opt .ic{width:26px;height:26px;color:var(--ok)}
.opt .ck .ic{width:16px;height:16px;color:inherit;stroke-width:3}
.eb .ic{width:22px;height:22px}
.rec .ic,.warn .ic{width:16px;height:16px;margin-right:2px;vertical-align:-3px}
.chip .ic,.star .ic{width:14px;height:14px;vertical-align:-2px}
.card h2 .ic{width:20px;height:20px;vertical-align:-3px;color:var(--ok);margin-right:4px}
.clk .ic{width:20px;height:20px}
.dt i .ic{width:18px;height:18px;stroke-width:3}

:root{--acc:#2ed3a0}
body{background:radial-gradient(120% 55% at 50% -8%,#2d5078 0%,transparent 62%),var(--bg);min-height:100vh;overscroll-behavior-y:none}
.card,.st div,.bub{box-shadow:inset 0 1px 0 #ffffff14,0 8px 22px #0003}
.card{border:1px solid #ffffff0d}
.ring circle.p{stroke:var(--acc)}
.ring{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--acc) 35%,transparent))}
.badge{background:var(--acc);color:#0c2a2a}
.go{background:var(--acc);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .1s,filter .2s}
.go:hover{filter:brightness(1.08)}
.ring .c .ic,.card h2 .ic{color:var(--acc)}
.tab{transition:background .2s,color .2s}
.tab[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
.dt.on i{background:var(--acc)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hm i{aspect-ratio:1;border-radius:8px;background:var(--card2)}
.hm i.on{background:var(--acc)}
.x{min-width:44px;min-height:44px}
.chip{min-height:40px}
.opt .del{margin-left:auto;font-size:12px;font-weight:800;color:var(--org);padding:8px}
.opt .del+.ck{margin-left:6px}
.card,.bub,.st{animation:fi .35s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.card,.bub,.st{animation:none}}
</style>
</head>
<body>
<main>
<div class="tabs" id="tabs" role="group" aria-label="Добавка"></div>
<div id="v"></div>
<p class="note">Це загальна інформація, а не медична порада. Дози й тривалість узгоджуй із лікарем.</p>
</main>
<div class="mas"><div class="mb" id="mb" role="status"></div><button id="mc" aria-label="Підказка від Бро"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="93" rx="22" ry="4" fill="#0005"/><circle cx="50" cy="54" r="36" fill="#2ed3a0"/><path d="M16 42Q50 22 84 42" stroke="#ff4d6d" stroke-width="9" fill="none" stroke-linecap="round"/><g class="ey"><circle cx="38" cy="56" r="8" fill="#fff"/><circle cx="62" cy="56" r="8" fill="#fff"/><circle cx="40" cy="57" r="4" fill="#12283a"/><circle cx="60" cy="57" r="4" fill="#12283a"/></g><path d="M40 72Q50 82 60 72" stroke="#12283a" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="29" cy="68" r="5" fill="#ff8aa0" opacity=".7"/><circle cx="71" cy="68" r="5" fill="#ff8aa0" opacity=".7"/></svg></button></div>
<div class="sh" id="sh"><div class="bd" id="bd"></div><div class="pn" id="pn" role="dialog" aria-modal="true"></div></div>
<script>
var ICP={dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',bottle:'<path d="M9 2h6v3l2 3v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8l2-3z"/><path d="M7 12h10"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',hex:'<path d="M12 2.5 20 7v10l-8 4.5L4 17V7z"/><circle cx="12" cy="12" r="2.5"/>',pill:'<path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',sprout:'<path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/>',flame:'<path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-6-4-9-1 4-4 6-4 12 0 4 3 8 7 8z"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>',check:'<path d="m5 12 5 5 9-10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',trendup:'<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>',trenddown:'<path d="m3 7 6 6 4-4 8 8M15 17h6v-6"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',heart:'<path d="M12 21S3 15 3 8.5A5 5 0 0 1 12 6a5 5 0 0 1 9 2.5C21 15 12 21 12 21z"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICP[n]||ICP.pill)+"</svg>"}
var S={
creatine:{n:"Креатин",e:ic("dumbbell"),c:"#e8920c",u:"г",d:5,ch:[3,5,10],
ph:["Креатин всмоктується в кишечнику й іде в кров, пік приблизно через 1–2 години.","Креатин вже в м’язах: з нього будується креатинфосфат, швидкий запас енергії для підходів."],
st:[[1,"Старт","М’язи починають поповнювати запас креатинфосфату."],[3,"3 дні","Запас росте. Може з’явитись легка затримка води в м’язах (до 1 кг), це нормально."],[7,"Тиждень","Багато хто помічає більше повторів і кращу витривалість у силових."],[28,"Місяць","Запас майже насичений (при 3–5 г на день). Ефект на силу та об’єм м’язів стабільний. Пий і в дні відпочинку."]]},
protein:{n:"Протеїн",e:ic("bottle"),c:"#3aa6d8",u:"г",d:30,ch:[20,30,40],
ph:["Білок розщеплюється до амінокислот, пік у крові приблизно через 1–2 години.","Амінокислоти йдуть на відновлення й ріст м’язів, синтез білка активний кілька годин."],
st:[[1,"Старт","Допомагає закрити добову норму білка."],[7,"Тиждень","Стабільний білок покращує відновлення між тренуваннями."],[28,"Місяць","Разом із тренуваннями помітніший приріст м’язів. Важлива загальна норма за день (≈1,6–2,2 г на кг ваги)."]]},
omega:{n:"Омега-3",e:ic("drop"),c:"#2fb5a0",u:"г",d:1,ch:[1,2,3],
ph:["Жири розщеплюються й всмоктуються, краще з їжею, що містить жири.","ЕПК і ДГК потрапляють у кров і поступово вбудовуються в клітинні мембрани."],
st:[[1,"Старт","Організм починає накопичувати омега-3, швидкого відчутного ефекту немає."],[14,"2 тижні","Рівень омега-3 у крові помітно росте."],[56,"2 місяці","Рівень у мембранах стабілізується. Омега-3 пов’язують зі зниженням тригліцеридів і запалення."]]},
vitd:{n:"Вітамін D",e:ic("sun"),c:"#e5c32b",u:"МО",d:2000,ch:[1000,2000,4000],
ph:["Вітамін D (жиророзчинний) всмоктується краще з їжею з жирами.","У печінці він перетворюється на 25(OH)D, форму, яку вимірюють в аналізі."],
st:[[1,"Старт","Починає підвищуватись запас у печінці та жирі."],[14,"2 тижні","Рівень у крові росте поступово."],[60,"2 місяці","Рівень 25(OH)D зазвичай стабілізується. Хороший момент здати аналіз."]]},
mag:{n:"Магній",e:ic("moon"),c:"#8b7ae0",u:"мг",d:200,ch:[100,200,400],
ph:["Магній всмоктується в тонкому кишечнику, пік у крові через 2–4 години.","Магній бере участь у роботі м’язів і нервів, за вечірнього прийому деяким легше розслабитись."],
st:[[1,"Старт","Поповнює запас магнію, який витрачається при потовиділенні та стресі."],[7,"Тиждень","Деякі помічають менше судом і кращий сон, ефект індивідуальний."],[28,"Місяць","Рівень магнію в тканинах стабільніший."]]},
